name: selftest
# CI самого конвейера: валидность профилей и workflow, локальный прогон
# composite actions (позитив на чистом собственном коде, негатив на
# синтетических находках, генерируемых в рантайме — фикстуры с «секретами»
# в git не живут). Floating-тег v1 двигается только после зелёного
# selftest (ADR 0006).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Профили валидны и согласованы со списком стадий
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          KNOWN = {"secrets","pii-gate","sast-semgrep","sast-sonar","sca",
                   "docs-lint","course-lint","container","sbom","dast"}
          MODES = {"B","A","R","off"}
          CORE = {"library","service","docs-shelf","course-content"}
          # vuln-demo — санкционированный класс-исключение: намеренно уязвимое
          # демо, все стадии advisory (в т.ч. secrets), витрина без блокировок.
          SECRETS_B_EXEMPT = {"vuln-demo"}
          def norm(v): return "off" if v is False else str(v)
          bad = []
          files = sorted(glob.glob("profiles/*.yml"))
          names = {f.split("/")[-1][:-4] for f in files}
          missing_core = CORE - names
          if missing_core: bad.append(f"нет базовых профилей: {sorted(missing_core)}")
          for f in files:
              cls = f.split("/")[-1][:-4]
              p = yaml.safe_load(open(f))
              st = p.get("stages", {})
              for k, v in st.items():
                  v = norm(v)  # YAML 1.1: off == False
                  if k not in KNOWN: bad.append(f"{f}: неизвестная стадия {k}")
                  if v not in MODES: bad.append(f"{f}: {k}={v} вне {MODES}")
              missing = KNOWN - set(st)
              if missing: bad.append(f"{f}: нет стадий {sorted(missing)}")
              if cls not in SECRETS_B_EXEMPT and norm(st.get("secrets")) != "B":
                  bad.append(f"{f}: secrets обязан быть B (кроме {sorted(SECRETS_B_EXEMPT)})")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"OK: {len(files)} профилей")
          PY

      - name: "Признак живости: логика health-issue на заглушке gh"
        run: bash tests/health-issue/test-health-issue.sh

      # Манифест композитного действия валидируется РАННЕРОМ при загрузке, а не
      # линтером: actionlint проверяет воркфлоу и молчит про action.yml. Ночь
      # 2026-08-02 показала цену — `${{ … }}` в описании входа сделало действие
      # незагружаемым, и это выяснилось только на боевом ночном прогоне, где
      # оно обязано было сообщить о падении. Шаг ниже загружает действие
      # по-настоящему; `state: skipped` — штатный no-op, issue он не трогает,
      # но манифест разбирается целиком.
      - name: "health-issue: манифест загружается (no-op прогон)"
        uses: ./actions/health-issue
        with:
          state: skipped
          title: "selftest: манифест health-issue загружается"
          token: ${{ github.token }}

      - name: "Негатив: fetch-verified обязан отказать на несошедшейся сумме"
        run: bash tests/negative/assert-fetch-verified.sh actions/fetch-verified/fetch_verified.sh

      # Гард на ОБЁРТКУ, а не на её скрипт: сборка аргументов в action.yml
      # не проверялась ничем, и булев вход, читавшийся как «непустая
      # строка», прожил там ровно поэтому.
      - name: "Негатив: обёртка fetch-verified соблюдает булев контракт"
        run: python3 tests/negative/assert-fetch-verified-wrapper.py .

      # Гард на РАЗБОР ВХОДОВ, а не на разрешение профиля: skip-stages не
      # проверял, существует ли переданное имя стадии, и опечатка молча не
      # выключала ничего. Потребитель при этом был уверен, что выключил.
      - name: "Негатив: profile-resolve обязан падать на опечатке в skip-stages"
        run: bash tests/negative/assert-profile-resolve.sh

      # Механика бампа пинов — общая на оба конвейера, значит ошибка в ней
      # тиражируется на семь пинов сразу. Сеть здесь не нужна: апстрим
      # подаётся файлом.
      - name: "Негатив: механика бампа читает нужный пин и не применяет мажор"
        run: bash tests/negative/assert-pins.sh

      # Стадия, прошедшая вхолостую, снаружи неотличима от чистой: на
      # Swift-репо semgrep сканировал ноль файлов и гейт печатал
      # «blocking-находок нет» (#33). Фикстура держит три состояния
      # раздельно — применимо / неприменимо / неизвестно.
      - name: "Негатив: применимость sast-semgrep различает ноль файлов и чистый прогон"
        run: bash tests/negative/assert-semgrep-inapplicable.sh .

      - name: "Гигиена манифестов: локальный uses в composite, диагностика под always()"
        run: python3 tests/lint/assert-composite-hygiene.py .

      # Детектора расхождения близнецов здесь НЕТ, и это не забывчивость:
      # публичная CI не может прочитать приватный репозиторий, а выдавать
      # ей токен ради проверки — решение владельца. Инвариант держится в
      # selftest приватного репо (tests/lint/assert-twins.py лежит и здесь
      # ровно затем, чтобы оба репо несли один файл).

      - name: actionlint (workflow-синтаксис)
        run: |
          set -euo pipefail
          base=https://github.com/rhysd/actionlint/releases/download/v1.7.1
          bash actions/fetch-verified/fetch_verified.sh \
            --url "$base/actionlint_1.7.1_linux_amd64.tar.gz" \
            --sums-url "$base/actionlint_1.7.1_checksums.txt" \
            --dest /tmp --member actionlint
          /tmp/actionlint -color

  stages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: profile-resolve — все классы разрешаются
        run: |
          python3 - <<'PY'
          import yaml
          m0 = ["secrets", "sast-semgrep", "sca"]
          def norm(v):
              return "off" if v is False else str(v)
          for c in ["library", "service", "docs-shelf", "course-content", "vuln-demo"]:
              st = yaml.safe_load(open(f"profiles/{c}.yml"))["stages"]
              modes = {s: norm(st.get(s, "off")) for s in m0}
              bad = {s: m for s, m in modes.items() if m not in ("B", "A", "off")}
              assert not bad, f"{c}: {bad}"
              print(f"resolve {c}: {modes}")
          PY

      - name: "Позитив: собственный код конвейера чист (library-профиль)"
        id: self
        uses: ./actions/gitleaks
        with:
          sarif-path: sarif/gitleaks.sarif

      - name: "Позитив: semgrep offline-rules на своём коде"
        uses: ./actions/semgrep
        with:
          sarif-path: sarif/semgrep.sarif

      - name: "Позитив: osv-scanner (лок-файлов нет — skip)"
        uses: ./actions/osv-scanner
        with:
          sarif-path: sarif/osv.sarif

      - name: "Негатив: gitleaks обязан найти эталонные секреты"
        run: |
          set -euo pipefail
          # Фикстуры и проверка — общие с nightly-bump (tests/negative/): пока
          # они жили копипастой в двух воркфлоу, фикстура успела протухнуть в
          # одном и не протухнуть в другом. Бинарь берётся тот, что распаковала
          # позитив-стадия выше, то есть проверяется действующий пин.
          tests/negative/assert-gitleaks.sh /tmp/gitleaks/gitleaks "действующий пин"

      - name: "Негатив: osv-scanner обязан найти известную уязвимость"
        run: |
          set -euo pipefail
          # До этого шага стадия sca проверялась в selftest только путём skip
          # («лок-файлов нет»), то есть зелёный selftest не отличал рабочий
          # сканер от сломанного: оба молчат. Бинарь берётся тот, что скачала
          # позитив-стадия выше, — проверяется действующий пин, а гард общий с
          # nightly-bump.
          tests/negative/assert-osv.sh /tmp/osv/osv-scanner "действующий пин"

      # Гард выше проверяет бинарь. Ниже — саму стадию: что наш вызов (форма
      # команды, флаги, имя файла отчёта) доводит находку до SARIF. Разные
      # вопросы: мажор 2.0 сломал бы именно вызов, оставив бинарь исправным.
      - name: "Фикстура с заведомой уязвимостью для прогона стадии"
        run: |
          set -euo pipefail
          mkdir -p /tmp/sca-fixture
          printf 'jinja2==2.10\n' > /tmp/sca-fixture/requirements.txt

      # Отчёт кладётся ВНЕ sarif/: этот каталог собирает sarif-report в сводку
      # прогона, и фикстурная находка стояла бы там рядом с настоящими. Таблица,
      # в которой заведомо есть строка «так и надо», перестаёт читаться.
      - name: "Негатив: стадия sca на фикстуре обязана упасть и записать SARIF"
        id: sca_negative
        continue-on-error: true
        uses: ./actions/osv-scanner
        with:
          target: /tmp/sca-fixture
          sarif-path: /tmp/sca-negative/osv.sarif

      - name: "Проверить исход негативного прогона стадии"
        run: |
          set -euo pipefail
          if [ "${{ steps.sca_negative.outcome }}" != "failure" ]; then
            echo "::error::стадия sca на jinja2==2.10 не упала (outcome=${{ steps.sca_negative.outcome }}) — блокирующая стадия пропускает известную уязвимость"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import sys

          EXPECTED = "GHSA-462w-v97r-4m45"
          try:
              sarif = json.load(open("/tmp/sca-negative/osv.sarif", encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              sys.exit(f"::error::стадия упала, но SARIF не прочитался ({exc}) — отчёт до потребителя не доедет")
          blob = json.dumps(sarif)
          if EXPECTED not in blob:
              sys.exit(
                  f"::error::стадия упала, но {EXPECTED} в SARIF нет. Падение без "
                  "находки в отчёте — это красный гейт без объяснения причины."
              )
          print(f"негатив ок: стадия упала и {EXPECTED} доехал до SARIF")
          PY

      - name: "Негатив: semgrep обязан поймать eval()"
        run: |
          set -euo pipefail
          mkdir -p /tmp/vuln
          printf 'user_input = input()\nresult = eval(user_input)\n' > /tmp/vuln/bad.py
          if semgrep scan --metrics=off --error --config actions/semgrep/rules /tmp/vuln; then
            echo "::error::semgrep не поймал eval()"; exit 1
          fi
          echo "негатив ок: eval() пойман"

      - name: "Негатив: M1-правила ловят path traversal и SSRF (py+js)"
        run: |
          set -euo pipefail
          mkdir -p /tmp/vuln-m1
          cat > /tmp/vuln-m1/traversal.py <<'FIX'
          from flask import request, send_file
          import requests

          def download():
              return open(request.args["path"]).read()

          def proxy():
              return requests.get(request.args["url"]).text
          FIX
          cat > /tmp/vuln-m1/traversal.js <<'FIX'
          function handler(req, res) {
            const data = fs.readFileSync(req.query.file);
            fetch(req.query.url);
            res.send(data);
          }
          FIX
          out=$(semgrep scan --metrics=off --json --config actions/semgrep/rules /tmp/vuln-m1 || true)
          for rule in py-open-request-path py-requests-request-url \
                      js-fs-request-path js-fetch-request-url; do
            if ! printf '%s' "$out" | grep -q "$rule"; then
              echo "::error::правило $rule не сработало на эталонной фикстуре"; exit 1
            fi
          done
          echo "негатив ок: все четыре M1-правила ловят эталонные находки"

      - name: "Позитив: M1-правила молчат на безопасных аналогах"
        run: |
          set -euo pipefail
          mkdir -p /tmp/safe-m1
          cat > /tmp/safe-m1/safe.py <<'FIX'
          import os, requests
          from flask import request, send_file

          ALLOWED = {"report": "/srv/files/report.pdf"}

          def download():
              return open(ALLOWED[request.args["name"]]).read()

          def fixed_fetch():
              return requests.get("https://api.example.com/status").text
          FIX
          if ! semgrep scan --metrics=off --error --config actions/semgrep/rules /tmp/safe-m1; then
            echo "::error::M1-правила дали ложное срабатывание на безопасном коде"; exit 1
          fi
          echo "позитив ок: ложных срабатываний нет"

      # Приёмник вызывается с `if: always()` ровно чтобы поймать аварийный
      # прогон — и до этой фикстуры показывал нечитаемый SARIF как "?", а
      # каталог без отчётов как «стадия пропущена», оставаясь зелёным.
      - name: "Негатив: приёмник обязан падать на нечитаемом SARIF"
        run: bash tests/negative/assert-sarif-report.sh actions/sarif-report/summarize.py

      - name: Отчёт
        if: always()
        uses: ./actions/sarif-report
        with:
          sarif-dir: sarif
