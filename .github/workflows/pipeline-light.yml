name: pipeline-light
# Публичный переиспользуемый workflow с ЛЁГКИМИ security-стадиями.
# Зачем отдельный публичный репо: GitHub запрещает публичному репозиторию
# вызывать reusable workflow / composite action из ПРИВАТНОГО репо (даже с
# выданным Access). Правило: private→private и public→public — да,
# public→private — нет. Приватный конвейер devsecops-pipeline обслуживает
# приватные репо; этот публичный компаньон — публичные.
#
# Потребитель (публичный репо) подключается одним файлом-адаптером:
#   uses: ignatenkofi/devsecops-pipeline-public/.github/workflows/pipeline-light.yml@v1
# (полный пример — examples/security.yml)
#
# Здесь ТОЛЬКО лёгкие стадии (hosted-раннеры, без стендов и лаб-сети):
#   secrets (gitleaks) · sast-semgrep (offline-rules) · sca (osv-scanner).
# Тяжёлые стадии (SonarQube CE, DAST, perf) публичным потребителям не
# положены по security-инварианту (self-hosted раннеры — только приватные
# репо) и живут в приватной части.
#
# Fail-политика: каждая стадия всегда continue-on-error (job не падает на
# самой находке), а решает финальный gate-шаг — валит job ТОЛЬКО для
# blocking-стадий (mode B) с находками. Advisory (A) находки → warning, но
# merge не блокируется. Так режим advisory работает надёжно (условное
# continue-on-error через ${{ }}-выражение на реальных находках не
# срабатывало — job падал даже на advisory-стадии).

on:
  workflow_call:
    inputs:
      repo-class:
        description: "library | service | docs-shelf | course-content | vuln-demo"
        required: true
        type: string
      skip-stages:
        description: "через запятую: лёгкие стадии, выключенные точечно"
        required: false
        type: string
        default: ""
      extra-stages:
        description: "через запятую: лёгкие стадии сверх профиля (advisory)"
        required: false
        type: string
        default: ""

jobs:
  light:
    name: "light · ${{ inputs.repo-class }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout потребителя
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks смотрит историю PR-диапазона

      - name: Профиль класса
        id: profile
        uses: ignatenkofi/devsecops-pipeline-public/actions/profile-resolve@v1
        with:
          repo-class: ${{ inputs.repo-class }}
          skip-stages: ${{ inputs.skip-stages }}
          extra-stages: ${{ inputs.extra-stages }}

      # Порядок: дешёвое и смертельное — раньше. Каждая стадия
      # continue-on-error: true — job не падает на находке; вердикт выносит
      # gate-шаг по mode из профиля.
      - name: "Стадия: secrets (gitleaks)"
        id: secrets
        if: steps.profile.outputs.secrets != 'off'
        continue-on-error: true
        uses: ignatenkofi/devsecops-pipeline-public/actions/gitleaks@v1
        with:
          sarif-path: sarif/gitleaks.sarif

      - name: "Стадия: sast-semgrep (offline-rules)"
        id: semgrep
        if: steps.profile.outputs.sast-semgrep != 'off'
        continue-on-error: true
        uses: ignatenkofi/devsecops-pipeline-public/actions/semgrep@v1
        with:
          sarif-path: sarif/semgrep.sarif

      - name: "Стадия: sca (osv-scanner)"
        id: sca
        if: steps.profile.outputs.sca != 'off'
        continue-on-error: true
        uses: ignatenkofi/devsecops-pipeline-public/actions/osv-scanner@v1
        with:
          sarif-path: sarif/osv.sarif

      - name: Отчёт (SARIF → артефакт + summary)
        if: always()
        uses: ignatenkofi/devsecops-pipeline-public/actions/sarif-report@v1
        with:
          sarif-dir: sarif

      # Финальный вердикт: blocking-стадия (mode B) с находкой → job красный;
      # advisory (A) находка → warning, merge не блокируется.
      - name: Gate — blocking-стадии решают статус job
        if: always()
        env:
          M_SECRETS: ${{ steps.profile.outputs.secrets }}
          M_SEMGREP: ${{ steps.profile.outputs.sast-semgrep }}
          M_SCA: ${{ steps.profile.outputs.sca }}
          O_SECRETS: ${{ steps.secrets.outcome }}
          O_SEMGREP: ${{ steps.semgrep.outcome }}
          O_SCA: ${{ steps.sca.outcome }}
        run: |
          set -euo pipefail
          fail=0
          gate() { # $1=mode $2=outcome $3=имя
            if [ "$2" = "failure" ]; then
              if [ "$1" = "B" ]; then
                echo "::error::blocking-стадия '$3' нашла проблемы — merge заблокирован"
                fail=1
              else
                echo "::warning::advisory-стадия '$3' нашла проблемы (merge не блокируется)"
              fi
            fi
          }
          gate "$M_SECRETS" "$O_SECRETS" secrets
          gate "$M_SEMGREP" "$O_SEMGREP" sast-semgrep
          gate "$M_SCA" "$O_SCA" sca

          # Стадия могла отработать вхолостую: правил под язык репозитория
          # нет, сканировано ноль файлов (#33). «Находок нет» про такую
          # стадию — ложь по умолчанию, поэтому вердикт формулируется иначе,
          # а не дополняется примечанием.
          inapplicable=""
          if [ -s sarif/.inapplicable ]; then
            inapplicable="$(sort -u sarif/.inapplicable | paste -sd', ' -)"
            echo "::warning::стадии без применимых правил: ${inapplicable} — они не проверили НИЧЕГО"
          fi
          if [ "$fail" = "0" ]; then
            if [ -n "$inapplicable" ]; then
              echo "gate: blocking-находок нет СРЕДИ ПРОВЕРЕННОГО; не проверялось: ${inapplicable}"
            else
              echo "gate: blocking-находок нет"
            fi
          fi
          exit $fail
