name: nightly-bump
# M1 (#8 приватного репо): пины инструментов (gitleaks / semgrep / osv-scanner)
# дрейфуют от апстрима — обновление должно быть рутиной, не подвигом.
# Ночной прогон: снять свежие версии → провалидировать кандидата на негатив-
# фикстурах и прогнать сами composite actions ДО правки пинов → ветка
# bump/tools + PR.
#
# Три честных ограничения:
# 1. PR, созданный GITHUB_TOKEN'ом, НЕ запускает selftest автоматически
#    (защита GitHub от рекурсии). Поэтому валидация выполняется прямо в этом
#    job'е, а ссылка на прогон кладётся в тело PR. Перед мержем selftest можно
#    дёрнуть вручную (re-run на PR / пустой коммит).
# 2. Крон-время дрейфует: заявленные 02:43 реально стреляют около 05:30–05:50
#    UTC (история прогонов workflow — единственный источник правды).
# 3. Мажорные бампы job'ом НЕ применяются (см. ниже) — только сообщаются.
#
# Политика мержа (тот же #8): минорные бампы владелец мержит пачкой; мажорные
# — только с разбором changelog апстрима. Раньше job складывал минор и мажор в
# один PR: минорные обновления оказывались заложниками мажорного разбора, и
# «мержится пачкой» не работало. Теперь применяются только не-мажорные бампы,
# а мажорные уезжают в отдельную issue и ждут решения человека. Тег v1
# двигается отдельно и только после зелёного selftest (ADR 0006).

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # признак живости: провал ночи обязан быть виден снаружи

concurrency: nightly-bump

env:
  HEALTH_TITLE: "nightly-bump: ночной прогон падает"
  MAJOR_TITLE: "nightly-bump: мажорный бамп ждёт разбора changelog"

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Текущие пины и свежие версии апстрима
        id: versions
        # Механика вынесена в общий action (#20): та же логика вызывается из
        # приватного конвейера. Инлайн-копия здесь была первой из двух — а
        # две копии одной логики в этом портфеле уже стоили дефекта (#32).
        uses: ./actions/pin-discover
        with:
          spec: .github/pins.json
          token: ${{ github.token }}

      # ── Валидация кандидата ДО правки пинов ─────────────────────────────
      # Прогоняется каждую ночь, даже когда бампать нечего: это одновременно
      # проверка кандидата и доказательство, что негатив-фикстуры не протухли
      # на действующем пине (ровно так протух прошлый гард — история в
      # tests/negative/secret-fixtures.sh).

      - name: "Негатив: gitleaks TARGET ловит эталонные находки"
        run: |
          set -euo pipefail
          V="${{ fromJSON(steps.versions.outputs.result).gitleaks.target }}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          # Кандидат качается тем же путём, что и боевой пин: у апстрима
          # файл сумм есть для каждой версии, поэтому «это же всего лишь
          # проба» не повод исполнять непроверенный бинарь — джоб несёт
          # contents: write и issues: write.
          bash actions/fetch-verified/fetch_verified.sh \
            --url "${base}/gitleaks_${V}_linux_x64.tar.gz" \
            --sums-url "${base}/gitleaks_${V}_checksums.txt" \
            --dest /tmp/gitleaks-new --member gitleaks
          tests/negative/assert-gitleaks.sh /tmp/gitleaks-new/gitleaks "$V"

      - name: "Негатив: semgrep TARGET парсит правила и ловит eval()"
        run: |
          set -euo pipefail
          V="${{ fromJSON(steps.versions.outputs.result).semgrep.target }}"
          python3 -m pip install --quiet "semgrep==${V}"
          mkdir -p /tmp/vuln
          printf 'user_input = input()\nresult = eval(user_input)\n' > /tmp/vuln/bad.py
          if semgrep scan --metrics=off --error --config actions/semgrep/rules /tmp/vuln; then
            echo "::error::semgrep ${V} не поймал eval()"; exit 1
          fi
          echo "semgrep ${V}: правила парсятся, негатив ок"

      - name: "Негатив: osv-scanner TARGET находит известную уязвимость"
        id: osv_validate
        run: |
          set -euo pipefail
          V="${{ fromJSON(steps.versions.outputs.result).osv.target }}"
          CUR="${{ fromJSON(steps.versions.outputs.result).osv.cur }}"
          mkdir -p /tmp/osv-new
          # Единственная загрузка конвейера, которая идёт без сверки, и это
          # осознанно: апстрим osv-scanner файла сумм не публикует (#13), а
          # сумму КАНДИДАТА неоткуда взять заранее — пин в actions/ описывает
          # действующую версию, а не ту, на которую мы только смотрим.
          #
          # Поэтому сумма здесь не проверяется, а УСТАНАВЛИВАЕТСЯ: шаг правки
          # пинов ниже перенесёт её в action.yml вместе с версией. Без этого
          # бамп версии оставил бы стадию с суммой от старого бинаря, и гард
          # начал бы падать не по делу — отказ, который выглядит как атака,
          # хуже отсутствия отказа.
          curl -sfL -o /tmp/osv-new/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${V}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-new/osv-scanner
          osv_sum="$(sha256sum /tmp/osv-new/osv-scanner | awk '{print $1}')"

          # Граница между «пин переезжает» и «пин сработал». Если версия НЕ
          # менялась, а сумма другая — это подмена уже опубликованного
          # ассета, то есть ровно то, ради чего пин и заведён. Автообновить
          # его здесь значило бы отмывать находку: ночной job молча
          # переписал бы пин и закрыл единственный сигнал.
          pinned="$(python3 - <<'PY'
          import re
          text = open("actions/osv-scanner/action.yml", encoding="utf-8").read()
          found = re.findall(r'default:\s*"([0-9a-f]{64})"', text)
          if len(found) != 1:
              raise SystemExit(f"ожидал ровно один пин sha256, нашёл {len(found)}")
          print(found[0])
          PY
          )"
          if [ "$V" = "$CUR" ] && [ "$osv_sum" != "$pinned" ]; then
            echo "::error::osv-scanner ${V}: версия та же, а сумма ассета изменилась" >&2
            echo "  в пине ${pinned}" >&2
            echo "  скачано ${osv_sum}" >&2
            echo "  Апстрим заменил уже опубликованный релиз либо загрузку подменили." >&2
            echo "  Разбирать руками; пин здесь не обновляется намеренно." >&2
            exit 1
          fi
          echo "OSV_TARGET_SHA256=${osv_sum}" >> "$GITHUB_OUTPUT"
          echo "osv-scanner ${V}: sha256 ${osv_sum} (станет пином, если версия поедет)"
          # Гард общий с selftest (tests/negative/) — по той же причине, по
          # которой туда переехала фикстура gitleaks: пока проверка жила
          # копипастой в двух воркфлоу, она успела протухнуть в одном и не
          # протухнуть в другом.
          tests/negative/assert-osv.sh /tmp/osv-new/osv-scanner "$V"

      # Прогон самих composite actions с версией-кандидатом. Негатив-фикстуры
      # выше проверяют «инструмент всё ещё находит»; это проверяет «стадия всё
      # ещё запускается» — то есть что новая версия не сменила имена команд,
      # флаги или коды возврата, на которых стоят наши actions. Ровно этот
      # класс поломок и приносят мажоры.

      - name: "Стадия secrets запускается на версии-кандидате"
        uses: ./actions/gitleaks
        with:
          version: ${{ fromJSON(steps.versions.outputs.result).gitleaks.target }}
          sarif-path: sarif/gitleaks-smoke.sarif

      - name: "Стадия sast-semgrep запускается на версии-кандидате"
        uses: ./actions/semgrep
        with:
          version: ${{ fromJSON(steps.versions.outputs.result).semgrep.target }}
          sarif-path: sarif/semgrep-smoke.sarif

      # sha256 обязателен вместе с version: пин в action.yml описывает
      # ДЕЙСТВУЮЩУЮ версию, а смоук гоняет кандидата. Передать одну версию
      # без суммы — значит требовать от кандидата сумму предшественника:
      # стадия честно откажется ставить бинарь, ночь упадёт здесь, и шаг
      # переноса пина ниже станет недостижим. Ровно тот отказ, который
      # выглядит как атака.
      - name: "Стадия sca запускается на версии-кандидате (лок-файлов нет — путь skip)"
        uses: ./actions/osv-scanner
        with:
          version: ${{ fromJSON(steps.versions.outputs.result).osv.target }}
          sha256: ${{ steps.osv_validate.outputs.OSV_TARGET_SHA256 }}
          sarif-path: sarif/osv-smoke.sarif

      # ── Применение ──────────────────────────────────────────────────────

      - name: Бампать нечего
        if: steps.versions.outputs.needs-bump == 'false'
        run: echo "::notice::не-мажорных обновлений нет; гарды на текущих пинах прогнаны и держат"

      - name: Записать целевые версии в пины
        if: steps.versions.outputs.needs-bump == 'true'
        uses: ./actions/pin-apply
        with:
          spec: .github/pins.json
          targets: ${{ steps.versions.outputs.targets }}

      # Пин суммы osv-scanner переезжает ТОЛЬКО вместе с версией и потому не
      # входит в общую механику: у апстрима файла сумм нет (#13), и сумма —
      # единственное, что отличает «вышел новый релиз» от «подменили старый».
      # Совпали версии — пин не трогаем: на этом случае падает валидация выше,
      # и разбирает его человек.
      - name: Перенести sha256 osv-scanner вместе с версией
        if: steps.versions.outputs.needs-bump == 'true'
        env:
          OSV_CUR: ${{ fromJSON(steps.versions.outputs.result).osv.cur }}
          OSV_TARGET: ${{ fromJSON(steps.versions.outputs.result).osv.target }}
          OSV_SHA: ${{ steps.osv_validate.outputs.OSV_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, "actions/pin-tools")
          import pins
          from pathlib import Path

          cur, target, sha = os.environ["OSV_CUR"], os.environ["OSV_TARGET"], os.environ["OSV_SHA"]
          if target == cur:
              print("osv: версия не поехала — сумму не трогаем")
              raise SystemExit(0)
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              raise SystemExit(f"::error::версия osv поехала, а сумма не снята: {sha!r}")
          pins.write_pin(Path("actions/osv-scanner/action.yml"), "sha256", sha)
          print(f"actions/osv-scanner/action.yml sha256 -> {sha}")
          PY
          git diff --stat

      - name: Ветка bump/tools + PR
        if: steps.versions.outputs.needs-bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "nightly-bump"
          git config user.email "nightly-bump@users.noreply.github.com"
          git checkout -B bump/tools
          git add actions/
          if git diff --cached --quiet; then
            echo "::notice::диф пуст (гонка с уже смерженным бампом?) — выходим"
            exit 0
          fi
          git commit -m "chore: bump пинов инструментов (nightly)"
          # Ветка стабильная: повторные ночи обновляют тот же PR, а не плодят новые.
          git push -f origin bump/tools

          BODY=$(cat <<EOF
          Ночное самообновление пинов (#8 приватного репо).

          | Инструмент | Было | Стало |
          |---|---|---|
          | gitleaks | ${{ fromJSON(steps.versions.outputs.result).gitleaks.cur }} | ${{ fromJSON(steps.versions.outputs.result).gitleaks.target }} |
          | semgrep | ${{ fromJSON(steps.versions.outputs.result).semgrep.cur }} | ${{ fromJSON(steps.versions.outputs.result).semgrep.target }} |
          | osv-scanner | ${{ fromJSON(steps.versions.outputs.result).osv.cur }} | ${{ fromJSON(steps.versions.outputs.result).osv.target }} |

          Версии-кандидаты прогнаны ДО правки пинов: негатив-фикстуры ловятся
          (\`tests/negative/\`) и сами стадии запускаются на новых версиях —
          [прогон](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Мажорные обновления сюда не попадают by design: они остаются на
          текущем пине и ждут разбора changelog в отдельной issue.

          selftest на этом PR сам не стартует (PR создан GITHUB_TOKEN'ом) —
          при желании дёрнуть вручную. Тег v1 двигается только после зелёного
          selftest (ADR 0006).
          EOF
          )

          EXISTING=$(gh pr list --head bump/tools --state open --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create --title "chore: bump пинов инструментов (nightly)" \
              --body "$BODY" --base main --head bump/tools
          else
            gh pr edit bump/tools --title "chore: bump пинов инструментов (nightly)" --body "$BODY"
            echo "::notice::PR уже открыт — обновлён"
          fi

      # ── Признак живости ────────────────────────────────────────────────

      # Признак живости — через переиспользуемый action (devsecops-pipeline#19):
      # у потребителей конвейера ровно та же потребность, и копипаста скрипта
      # по репозиториям была бы третьей копией одной логики — тем самым, за что
      # выше ругаются embedded-скрипты бэкапа.

      # Мажор не применяется автоматически — но «разбери changelog» без единой
      # цифры о самом кандидате перекладывает на человека и ту работу, которую
      # машина делает за минуту. Гарды на мажорном кандидате прогоняются в
      # advisory-режиме, и вердикт уезжает в тело issue: разбор начинается с
      # «эталонная находка на месте / вот на чём падает», а не с нуля.
      - name: "Мажоры: прогнать гарды на кандидате (advisory)"
        id: major_probe
        if: steps.versions.outputs.has-major == 'true'
        env:
          MAJORS: ${{ steps.versions.outputs.majors }}
        run: |
          set -uo pipefail   # без -e: падение гарда здесь — это результат, а не отказ ночи
          verdict=""
          IFS=';' read -ra items <<< "$MAJORS"
          for item in "${items[@]}"; do
            tool=$(echo "$item" | awk '{print $1}')
            new=$(echo "$item"  | awk '{print $NF}')
            log=$(mktemp)
            case "$tool" in
              gitleaks)
                mkdir -p /tmp/probe-gitleaks
                base="https://github.com/gitleaks/gitleaks/releases/download/v${new}"
                # Проба мажора — тоже исполнение чужого бинаря в этом job'е,
                # так что качается со сверкой. Несошедшаяся сумма попадёт в
                # $log и станет вердиктом пробы, как и любой другой отказ.
                if bash actions/fetch-verified/fetch_verified.sh \
                     --url "${base}/gitleaks_${new}_linux_x64.tar.gz" \
                     --sums-url "${base}/gitleaks_${new}_checksums.txt" \
                     --dest /tmp/probe-gitleaks --member gitleaks >>"$log" 2>&1; then
                  tests/negative/assert-gitleaks.sh /tmp/probe-gitleaks/gitleaks "$new" >>"$log" 2>&1
                  rc=$?
                else
                  echo "не удалось скачать релиз" >>"$log"; rc=90
                fi ;;
              osv)
                mkdir -p /tmp/probe-osv
                # Без сверки — и это единственное такое место, оставшееся
                # осознанно: файла сумм апстрим не публикует (#13), а пин
                # мажорной версии-кандидата взять неоткуда. Проба мажора и
                # так не двигает пины: её вердикт уезжает в issue человеку.
                if curl -sfL -o /tmp/probe-osv/osv-scanner \
                     "https://github.com/google/osv-scanner/releases/download/v${new}/osv-scanner_linux_amd64" 2>>"$log"; then
                  chmod +x /tmp/probe-osv/osv-scanner
                  tests/negative/assert-osv.sh /tmp/probe-osv/osv-scanner "$new" >>"$log" 2>&1
                  rc=$?
                else
                  echo "не удалось скачать релиз" >>"$log"; rc=90
                fi ;;
              semgrep)
                if python3 -m pip install --quiet "semgrep==${new}" >>"$log" 2>&1; then
                  mkdir -p /tmp/probe-vuln
                  printf 'user_input = input()\nresult = eval(user_input)\n' > /tmp/probe-vuln/bad.py
                  if semgrep scan --metrics=off --error --config actions/semgrep/rules /tmp/probe-vuln >>"$log" 2>&1; then
                    echo "semgrep ${new} не поймал eval()" >>"$log"; rc=1
                  else
                    echo "semgrep ${new}: правила парсятся, негатив ок" >>"$log"; rc=0
                  fi
                else
                  echo "не удалось установить пакет" >>"$log"; rc=90
                fi ;;
              *) echo "неизвестный инструмент" >>"$log"; rc=91 ;;
            esac
            if [ "$rc" = "0" ]; then
              verdict="${verdict}- \`${tool} ${new}\`: гард прошёл — инструмент всё ещё находит эталонную находку."$'\n'
            else
              why=$(grep -m1 -E '::error::|не удалось|не поймал|неизвестный' "$log" | sed 's/::error:://' | cut -c1-300)
              verdict="${verdict}- \`${tool} ${new}\`: **гард не прошёл** (rc=${rc}) — ${why:-см. лог прогона}"$'\n'
            fi
          done
          {
            echo "VERDICT<<PROBE_EOF"
            printf '%s' "$verdict"
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$verdict"

      - name: "Мажоры: завести issue или снять, если догнали апстрим"
        uses: ./actions/health-issue
        with:
          state: ${{ steps.versions.outputs.has-major == 'true' && 'open' || 'close' }}
          title: ${{ env.MAJOR_TITLE }}
          token: ${{ github.token }}
          close-comment: "Мажорных расхождений с апстримом больше нет — закрыто ночным прогоном."
          body: |
            Ночной прогон обнаружил мажорные обновления. Job их **не применяет**:
            мажор меняет поведение инструмента, а иногда и CLI, на который стоят
            наши composite actions.

            Ждут разбора: ${{ steps.versions.outputs.majors }}

            Гарды, прогнанные на кандидате этой ночью (advisory — на результат
            ночи не влияют):

            ${{ steps.major_probe.outputs.VERDICT }}

            Гард отвечает только на вопрос «инструмент всё ещё находит эталонную
            находку». Зелёный гард **не** означает, что мажор безопасен: он не
            видит смены дефолтов, формата отчёта и сетевого профиля — это и
            остаётся предметом разбора changelog.

            Что сделать: прочитать changelog апстрима, поднять пин руками в
            `actions/*/action.yml`, прогнать selftest. Issue закроется сама,
            когда пин догонит апстрим.

            [Ночной прогон](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "Итог ночи виден снаружи: падение заводит issue, зелёный снимает"
        if: always()
        uses: ./actions/health-issue
        with:
          state: ${{ job.status }}
          title: ${{ env.HEALTH_TITLE }}
          token: ${{ github.token }}
          close-comment: "Ночной прогон снова зелёный — закрыто автоматически."
          body: |
            Ночной прогон `nightly-bump` завершился неуспехом.

            Пины инструментов не обновляются, пока это не починено — то есть
            конвейер тихо стареет. Провалившийся scheduled-workflow сам о себе
            не сообщает, поэтому issue заводится автоматически и закроется, когда
            ночь снова станет зелёной.

            [Упавший прогон](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
