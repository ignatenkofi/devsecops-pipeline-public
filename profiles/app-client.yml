# Класс: клиентское приложение (atlas-native, yinguo-native, hanzi-native, ...)
# — собирается в артефакт для пользователя/магазина (.app/.ipa), без контейнера
# и без сетевой поверхности. Заведён по devsecops-pipeline#34: до него Swift-репо
# брали `library` наугад, а по смыслу это подмена (там container: A, здесь off).
# Режимы: B blocking · A advisory · R только на release · off не запускается.
# Матрица — из ARCHITECTURE «Репо-класс × стадии»; исполняются реализованные
# стадии (M0: secrets, sast-semgrep, sca), остальные ждут своих фаз.
#
# Чего здесь НЕТ (осознанно): языковых стадий build/test/lint под Swift. Их
# исполняет Xcode Cloud из подписки владельца, а не конвейер (ADR 0007
# приватного репо, 2026-09-10): отдельный status check на PR, который
# потребитель требует в branch protection рядом с `security`. Стадия
# mobile-scan (#35) — Linux-стадия над артефактом из Xcode Cloud: не шаг
# PR-конвейера, а свой воркфлоу на `repository_dispatch` (ADR 0007).
# Помимо неё содержательная стадия для Swift-репо одна — secrets
# (sast-semgrep без Swift-правил вхолостую, #33).
class: app-client
stages:
  secrets: B
  pii-gate: A        # M2 (после доставки pattern packs pii-mcp)
  sast-semgrep: B    # осмысленно после #33 (Swift-правил в offline-паке нет)
  sast-sonar: A      # M1 (полигон)
  sca: B
  docs-lint: A       # M1
  course-lint: "off"
  container: "off"   # артефакт — .app/.ipa, не образ
  sbom: R            # M1
  dast: "off"        # веб-поверхности нет
  mobile-scan: A     # #35: MobSF над .ipa из Xcode Cloud, воркфлоу события pipeline-mobile.yml
