name: profile-resolve
description: >-
  Читает profiles/<repo-class>.yml из репозитория конвейера (материализуется
  вместе с action) и отдаёт по каждой M0-стадии режим: B (blocking),
  A (advisory) или off. skip-stages выключает, extra-stages включает
  как advisory.
inputs:
  repo-class:
    required: true
  skip-stages:
    required: false
    default: ""
  extra-stages:
    required: false
    default: ""
outputs:
  secrets:
    value: ${{ steps.resolve.outputs.secrets }}
  sast-semgrep:
    value: ${{ steps.resolve.outputs.sast-semgrep }}
  sca:
    value: ${{ steps.resolve.outputs.sca }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        REPO_CLASS: ${{ inputs.repo-class }}
        SKIP: ${{ inputs.skip-stages }}
        EXTRA: ${{ inputs.extra-stages }}
      run: |
        set -euo pipefail
        PROFILE="${GITHUB_ACTION_PATH}/../../profiles/${REPO_CLASS}.yml"
        if [ ! -f "$PROFILE" ]; then
          echo "::error::Неизвестный repo-class '${REPO_CLASS}' (нет profiles/${REPO_CLASS}.yml)"; exit 1
        fi
        python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
        # Скрипт вынесен из heredoc в resolve.py: встроенный в YAML код нельзя
        # запустить иначе как целым прогоном Actions, поэтому на него нельзя
        # написать гард — и дефект «skip-stages молча глотает опечатку» прожил
        # незамеченным ровно поэтому. Гард — tests/negative/assert-profile-resolve.sh.
        # --implemented перечисляет стадии ЭТОГО репо. Сам resolve.py про них
        # не знает намеренно: файл общий с приватным конвейером и обязан
        # совпадать байт-в-байт (tests/lint/assert-twins.py), а наборы стадий
        # у репозиториев разные. Различаться позволено манифестам.
        python3 "${GITHUB_ACTION_PATH}/resolve.py" \
          "$PROFILE" "${GITHUB_ACTION_PATH}/../../profiles" \
          --implemented "secrets,sast-semgrep,sca" >> "$GITHUB_OUTPUT"
        echo "Профиль ${REPO_CLASS}: $(grep -E '^(secrets|sast-semgrep|sca)=' "$GITHUB_OUTPUT" | tail -3 | tr '\n' ' ')"
