name: profile-resolve
description: >-
  Читает profiles/<repo-class>.yml из репозитория конвейера (материализуется
  вместе с action) и отдаёт по каждой M0-стадии режим: B (blocking),
  A (advisory) или off. skip-stages выключает, extra-stages включает
  как advisory.
inputs:
  repo-class:
    required: true
  skip-stages:
    required: false
    default: ""
  extra-stages:
    required: false
    default: ""
outputs:
  secrets:
    value: ${{ steps.resolve.outputs.secrets }}
  sast-semgrep:
    value: ${{ steps.resolve.outputs.sast-semgrep }}
  sca:
    value: ${{ steps.resolve.outputs.sca }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        REPO_CLASS: ${{ inputs.repo-class }}
        SKIP: ${{ inputs.skip-stages }}
        EXTRA: ${{ inputs.extra-stages }}
      run: |
        set -euo pipefail
        PROFILE="${GITHUB_ACTION_PATH}/../../profiles/${REPO_CLASS}.yml"
        if [ ! -f "$PROFILE" ]; then
          echo "::error::Неизвестный repo-class '${REPO_CLASS}' (нет profiles/${REPO_CLASS}.yml)"; exit 1
        fi
        python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
        python3 - "$PROFILE" >> "$GITHUB_OUTPUT" <<'PY'
        import os, sys, yaml
        profile = yaml.safe_load(open(sys.argv[1]))
        stages = profile.get("stages", {})
        skip = {s.strip() for s in os.environ.get("SKIP", "").split(",") if s.strip()}
        extra = {s.strip() for s in os.environ.get("EXTRA", "").split(",") if s.strip()}
        m0 = ["secrets", "sast-semgrep", "sca"]  # реализованные стадии
        # YAML 1.1: голое off парсится как False — нормализуем
        def norm(v):
            return "off" if v is False else str(v)
        for name in m0:
            mode = norm(stages.get(name, "off"))
            if name in skip:
                mode = "off"
            elif name in extra and mode == "off":
                mode = "A"
            if mode not in ("B", "A", "off"):
                mode = "off"
            print(f"{name}={mode}")
        pending = [s for s, m in stages.items() if s not in m0 and norm(m) != "off"]
        if pending:
            print(f"::notice::Стадии из профиля ещё не реализованы (ждут M1/M2): {', '.join(sorted(pending))}",
                  file=sys.stderr)
        PY
        echo "Профиль ${REPO_CLASS}: $(grep -E '^(secrets|sast-semgrep|sca)=' "$GITHUB_OUTPUT" | tail -3 | tr '\n' ' ')"
