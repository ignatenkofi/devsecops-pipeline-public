name: sarif-report
description: >-
  Приёмник результатов: SARIF-файлы → артефакт прогона + сводка в job
  summary. Code scanning для приватных репо без Code Security недоступен —
  каскад по ADR 0003 (артефакт + summary как базовый путь).
inputs:
  sarif-dir:
    required: false
    default: sarif
  job:
    # Половина конвейера, чей отчёт уезжает, — суффикс имени артефакта
    # `sarif-<job>-<run_id>` (приватный devsecops-pipeline#78; тот же
    # принцип, что у `advisory-verdict-<job>-<run_id>` в ADR 0008 близнеца).
    # Один прогон приватного фасада зовёт приёмник дважды — `light` здесь
    # и `stages` у близнеца, — и до суффикса обе половины выгружали
    # одноимённый `sarif-<run_id>`: upload-artifact@v4 дубль не отверг, а
    # загрузка по имени брала случайную половину. Вызывающий воркфлоу
    # передаёт литерал; без него берётся id текущей джобы — двух
    # одинаковых в одном прогоне не бывает.
    description: "суффикс имени артефакта: light | stages | mobile | release (без него — id джобы)"
    required: false
    default: ${{ github.job }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SARIF_DIR: ${{ inputs.sarif-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$SARIF_DIR"
        # Сводка и гард читаемости — в summarize.py: нечитаемый SARIF раньше
        # попадал в таблицу как "?" на зелёном прогоне, а пустой каталог —
        # как "skip" (см. докстринг скрипта). Выход 1 = отчёт стадии не
        # разбирается; сводка при этом всё равно дописана.
        python3 "${GITHUB_ACTION_PATH}/summarize.py" \
          --sarif-dir "$SARIF_DIR" --out "$GITHUB_STEP_SUMMARY"
    # `if: always()` обязателен с тех пор, как шаг выше научился падать:
    # шаги composite action по умолчанию не идут после отказа предыдущего,
    # и артефакт с нечитаемым SARIF'ом не уехал бы ровно тогда, когда он
    # нужен для разбора.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sarif-${{ inputs.job }}-${{ github.run_id }}
        path: ${{ inputs.sarif-dir }}
        if-no-files-found: ignore
        retention-days: 30
