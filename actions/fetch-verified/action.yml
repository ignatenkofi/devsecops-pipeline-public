name: fetch-verified
description: >-
  Скачать релизный ассет апстрима, сверить sha256 и только потом
  распаковать/сделать исполняемым. Общий помощник для стадий обоих репо
  конвейера (#24). Ожидаемая сумма берётся либо из файла сумм апстрима
  (sums-url), либо из пина в этом репозитории (sha256) — ровно один из
  двух, и это разные модели доверия, см. шапку fetch_verified.sh.

  Отказ при расхождении суммы и при отсутствии записи об ассете в файле
  сумм — оба случая роняют шаг.

  Границы охвата, чтобы манифест не читался как «неподтверждённых
  загрузок не осталось»: в этом репо через него идут все загрузки, кроме
  пробы МАЖОРНОЙ версии osv-scanner в nightly-bump — там сумму кандидата
  взять неоткуда, и это записано на месте.

  Это обёртка для вызова ИЗ ВОРКФЛОУ (`uses: …/actions/fetch-verified@v1`).
  Из другого composite action зови не её, а скрипт по пути
  `${GITHUB_ACTION_PATH}/../fetch-verified/fetch_verified.sh`: локальный
  `uses: ./…` внутри composite резолвится относительно рабочего каталога
  ПОТРЕБИТЕЛЯ, а не репозитория action'а, — в selftest прошло бы, у
  потребителя сломалось бы.
inputs:
  url:
    description: "URL релизного ассета"
    required: true
  sums-url:
    description: "URL файла контрольных сумм апстрима (строки `sha256  имя`); взаимоисключающе с sha256"
    required: false
    default: ""
  sha256:
    description: "ожидаемая сумма пином в этом репозитории — для апстримов без файла сумм; взаимоисключающе с sums-url"
    required: false
    default: ""
  dest:
    description: "каталог, куда положить результат"
    required: true
  member:
    description: "имя файла внутри tar.gz — для архивов; взаимоисключающе с output"
    required: false
    default: ""
  output:
    description: "имя, под которым положить голый бинарь; взаимоисключающе с member"
    required: false
    default: ""
  extract-all:
    description: "распаковать архив целиком (для вложенной раскладки); 'true' включает, взаимоисключающе с member/output"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FV_URL: ${{ inputs.url }}
        FV_SUMS: ${{ inputs.sums-url }}
        FV_SHA256: ${{ inputs.sha256 }}
        FV_DEST: ${{ inputs.dest }}
        FV_MEMBER: ${{ inputs.member }}
        FV_OUTPUT: ${{ inputs.output }}
        FV_EXTRACT_ALL: ${{ inputs.extract-all }}
      run: |
        set -euo pipefail
        ARGS=(--url "$FV_URL" --dest "$FV_DEST")
        [ -n "$FV_SUMS" ]   && ARGS+=(--sums-url "$FV_SUMS")
        [ -n "$FV_SHA256" ] && ARGS+=(--sha256 "$FV_SHA256")
        [ -n "$FV_MEMBER" ] && ARGS+=(--member "$FV_MEMBER")
        [ -n "$FV_OUTPUT" ] && ARGS+=(--output "$FV_OUTPUT")
        # Булев вход сравнивается со строкой "true", а НЕ проверяется на
        # непустоту: входы Actions приходят строками, и естественное
        # `with: {extract-all: false}` даёт непустое "false". Проверка
        # `-n` включала бы режим ровно там, где потребитель его выключает.
        # Та же идиома, что у `check-links` в actions/docs-lint.
        case "$FV_EXTRACT_ALL" in
          true|True|TRUE) ARGS+=(--extract-all) ;;
          ""|false|False|FALSE) ;;
          *) echo "::error::fetch-verified: extract-all ждёт true|false, получено '$FV_EXTRACT_ALL'" >&2; exit 2 ;;
        esac
        bash "${GITHUB_ACTION_PATH}/fetch_verified.sh" "${ARGS[@]}"
